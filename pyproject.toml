[project]
name = "pyspark-medallion-platform"
version = "0.1.0"
description = "Production-style PySpark Medallion Architecture platform for ecommerce analytics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=3.2.1",
    "duckdb>=1.0.0",
    "pandas>=2.2.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "pyspark>=3.5.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "pre-commit>=3.8.0",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.2",
]

[project.scripts]
medallion = "pyspark_medallion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyspark_medallion"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
files = ["src/pyspark_medallion", "tests"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]
