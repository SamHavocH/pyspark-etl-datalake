services:
  datalake:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env.example
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["datalake", "run"]
    healthcheck:
      test: ["CMD", "python", "-c", "import datalake; print(datalake.__version__)"]
      interval: 30s
      timeout: 10s
      retries: 3
