services:
  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: medallion-spark
    environment:
      APP_NAME: pyspark-medallion-platform
      DATA_ROOT: /workspace/data
      RAW_DIR: /workspace/data/raw
      BRONZE_DIR: /workspace/data/bronze
      SILVER_DIR: /workspace/data/silver
      GOLD_DIR: /workspace/data/gold
      REJECTED_DIR: /workspace/data/rejected_records
      QUALITY_REPORT_DIR: /workspace/data/quality_reports
      BOOKMARK_PATH: /workspace/data/bookmarks.json
      SPARK_MASTER: local[*]
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]

  spark-history:
    image: apache/spark:3.5.1
    container_name: medallion-spark-history
    ports:
      - "18080:18080"
    volumes:
      - ./data/spark-events:/tmp/spark-events
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]

  postgres:
    image: postgres:16-alpine
    container_name: medallion-postgres
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
